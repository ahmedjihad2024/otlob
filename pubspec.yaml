name: otlob
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  animated_visibility: ^0.0.4
  back_button_interceptor: ^8.0.5
  bloc: ^9.2.1
  cupertino_icons: ^2.0.0
  dartz: ^0.10.1
  dio: null
  dlibphonenumber: ^1.1.74
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.1.1
  google_fonts: ^9.0.0
  json_annotation: ^4.11.0
  logger: ^2.7.0
  lottie: ^3.3.1
  pretty_dio_logger: ^1.3.1
  pull_to_refresh: ^2.0.0
  retrofit: ^4.10.0
  shared_preferences: ^2.5.5
  async: ^2.13.1
  cached_network_image: ^4.0.5
  carousel_slider: ^5.0.0
  decimal: ^3.0.2
  defer_pointer: ^0.0.2
  easy_localization: ^3.0.8
  equatable: ^2.0.5
  # firebase_core: ^4.4.0
  # firebase_messaging: ^16.1.1
  flutter_animate: ^4.5.2
  flutter_dotenv: ^6.0.0
  # flutter_local_notifications: ^21.0.0
  flutter_screenutil: ^5.9.3
  fluttertoast: ^10.0.2
  geocoding: ^5.0.0
  geolocator: ^14.1.2
  intl: ^0.20.3
  nice_text_form:
    git: https://github.com/ahmedjihad2024/nice_text_form.git
  path_provider: ^2.1.5
  permission_handler: ^13.0.2
  shimmer: ^4.0.0
  smooth_corner: ^1.1.1
  url_launcher: ^6.3.3

dev_dependencies:
  build_runner: ^2.12.0
  flutter_gen_runner:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.13.2
  retrofit_generator: ^10.2.6

  flutter_launcher_icons: ^0.14.4
  # mocktail: ^1.0.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app-icon.png"
  min_sdk_android: 21

flutter_gen:
  output: lib/core/res/gen/

  integrations:
    image: true
    flutter_svg: true
    rive: false
    lottie: true
  fonts:
    enabled: false

flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/svg/
    - assets/images/
    - assets/fonts/
    - assets/translations/
    - assets/lottie_animations/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Thin.ttf
          weight: 100
        - asset: assets/fonts/inter/Inter-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/inter/Inter-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/inter/Inter-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/inter/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/inter/Inter-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/inter/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/inter/Inter-ExtraBoldItalic.ttf
          weight: 800
          style: italic
